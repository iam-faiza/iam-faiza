<svg width="900" height="70" viewBox="0 0 900 70" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="70" fill="#0d1117"/>
  <defs>
    <clipPath id="clip">
      <rect width="900" height="70"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <g id="row">
      <!-- Row 1 -->
      <g transform="translate(0,0)">
        <image href="https://cdn.simpleicons.org/html5/E34F26" x="0" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/css3/1572B6" x="90" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/javascript/F7DF1E" x="180" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/nodedotjs/339933" x="270" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/express/FFFFFF" x="360" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/mongodb/47A248" x="450" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/git/F05032" x="540" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/github/FFFFFF" x="630" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/linux/FCC624" x="720" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/python/3776AB" x="810" y="15" width="40" height="40"/>
      </g>
      <!-- Row 2 (duplicate, placed right after row 1 for seamless loop) -->
      <g transform="translate(900,0)">
        <image href="https://cdn.simpleicons.org/html5/E34F26" x="0" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/css3/1572B6" x="90" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/javascript/F7DF1E" x="180" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/nodedotjs/339933" x="270" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/express/FFFFFF" x="360" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/mongodb/47A248" x="450" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/git/F05032" x="540" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/github/FFFFFF" x="630" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/linux/FCC624" x="720" y="15" width="40" height="40"/>
        <image href="https://cdn.simpleicons.org/python/3776AB" x="810" y="15" width="40" height="40"/>
      </g>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0,0"
        to="-900,0"
        dur="14s"
        repeatCount="indefinite"/>
    </g>
  </g>
</svg>
